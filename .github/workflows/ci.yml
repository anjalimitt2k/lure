name: CI

# Runs entirely offline. No API key is configured, referenced, or needed:
# the opt-in LLM tier is exercised through a deterministic stub, and
# `reproduce` is the offline pipeline by construction. If CI ever starts
# needing a secret, that is a bug in the offline core, not a missing secret.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Reproduce the full offline pipeline
        run: python -m lure.cli reproduce

      - name: Check the LLM tier degrades gracefully without credentials
        run: |
          python -m lure.cli run-llm
          echo "run-llm exited $? without credentials (expected 0)"

      - name: Check results are byte-identical on a second run
        run: |
          cp -r results /tmp/results-first
          python -m lure.cli reproduce
          diff -r /tmp/results-first results
          echo "reproduce is byte-identical"

      - name: Upload artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: lure-results
          path: results/
